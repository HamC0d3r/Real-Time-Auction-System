services:
  seq:
    image: datalust/seq:latest
    container_name: mazadzone-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341" 
      - "8081:80"  
    volumes:
      - seq-data:/data
    networks:
      backend_network:
        aliases:
          - seq

  # 1. ADDED: The GELF Forwarder Sidecar for Seq
  seq-input-gelf:
    image: datalust/seq-input-gelf:latest
    container_name: mazadzone-seq-gelf
    depends_on:
      - seq
    ports:
      - "12201:12201/udp" # UDP port required for GELF
    environment:
      - SEQ_ADDRESS=http://seq:5341 # Points to Seq on the internal network
    networks:
      - backend_network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mazadzone-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    ports:
      - "2222:1433" 
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      backend_network:
        aliases:
          - sqlserver
    restart: unless-stopped
    # 2. ADDED: Routing SQL logs to Seq
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "sqlserver"

  postgres:
    image: postgres:16-alpine
    container_name: mazadzone-postgres
    environment:
      - POSTGRES_DB=MazadZoneDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrong@Passw0rd!
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      backend_network:
        aliases:
          - postgres
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: mazadzone-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      backend_network:
        aliases:
          - redis
    # 2. ADDED: Routing Redis logs to Seq
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "redis"

